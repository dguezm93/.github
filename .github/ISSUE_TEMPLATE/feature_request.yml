name: Feature request
description: Propose an improvement
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who needs this and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Include acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
